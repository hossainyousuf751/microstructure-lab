[build-system]
requires = ["setuptools>=77"]   # SPDX license expression (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "lobkit"
version = "0.2.0"
description = "Limit order book reconstruction, order-flow analytics and market-making simulation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Yousuf Hossain Shafeen"}]
requires-python = ">=3.10"
keywords = ["market microstructure", "limit order book", "order flow imbalance", "market making",
            "avellaneda-stoikov", "micro-price", "binance", "bybit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.urls]
Homepage = "https://github.com/hossainyousuf751/microstructure-lab"
Documentation = "https://github.com/hossainyousuf751/microstructure-lab#readme"
Changelog = "https://github.com/hossainyousuf751/microstructure-lab/blob/main/CHANGELOG.md"
Issues = "https://github.com/hossainyousuf751/microstructure-lab/issues"

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
live = ["websockets>=12", "requests>=2.28"]
dev = ["pytest>=7", "matplotlib>=3.7", "ruff>=0.5", "build>=1.2", "twine>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes more than a few seconds; deselect with -m \"not slow\""]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["B008"]   # frozen dataclass defaults are safe
