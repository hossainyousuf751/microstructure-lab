name: publish

# Automated releases.
# Every push to main runs release-please, which keeps one "release PR" open with the next
# version (from conventional commit titles) and the CHANGELOG entry. Merging that PR makes
# release-please tag the commit and publish the GitHub Release, and this same run then builds
# the package and uploads it to PyPI with trusted publishing (no stored token).
# The upload must live in this run: a release created with GITHUB_TOKEN does not trigger
# other workflows. PyPI trusts this file by name, so keep it called publish.yml.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # tag and GitHub Release
      pull-requests: write   # open and update the release PR
      issues: write          # release PR labels
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Tag matches package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          tag="${{ needs.release-please.outputs.tag_name }}"
          test "v$version" = "$tag" || { echo "tag $tag != v$version"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/lobkit/
    permissions:
      id-token: write    # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
