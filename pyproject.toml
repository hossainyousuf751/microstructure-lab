[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lobkit"
version = "0.2.0"
description = "Limit order book reconstruction, order-flow analytics and market-making simulation"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Yousuf Hossain Shafeen"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
live = ["websockets>=12", "requests>=2.28"]
dev = ["pytest>=7", "matplotlib>=3.7", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes more than a few seconds; deselect with -m \"not slow\""]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["B008"]   # frozen dataclass defaults are safe
