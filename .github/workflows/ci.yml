name: tests

on:
  push:
    branches: [main]     # branches are tested through their PR; no duplicate runs
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Package builds and its metadata renders on PyPI
        if: matrix.python-version == '3.12'
        run: python -m build && twine check --strict dist/*
