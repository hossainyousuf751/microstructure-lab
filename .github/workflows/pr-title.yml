name: pr-title

# Squash-merging makes the PR title the commit message on main, and release-please reads those
# messages to pick the next version and write the CHANGELOG. So PR titles must be conventional:
#   feat: ...  -> minor version, "Added"     fix: ...   -> patch, "Fixed"
#   docs: ... perf: ... refactor: ... -> listed       chore/ci/build/test/style: hidden
# A "!" after the type (feat!: ...) marks a breaking change.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
