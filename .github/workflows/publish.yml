name: publish

# Fully automated releases. On every push to main:
#   1. the tests run on main (a failing main never releases);
#   2. release-please opens or updates the release PR (next version from conventional commit
#      titles, plus the CHANGELOG entry), and this workflow merges it straight away;
#   3. release-please runs again, sees the merged release PR, and tags vX.Y.Z and publishes the
#      GitHub Release;
#   4. the package is built from the tag and uploaded to PyPI with trusted publishing.
# All of it happens in one run on purpose: anything done with GITHUB_TOKEN (merging the release
# PR, creating the release) does not trigger further workflows.
# PyPI's trusted publisher is bound to this file name: keep it publish.yml.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: publish        # two quick merges must not release twice
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # merge the release PR, tag, GitHub Release
      pull-requests: write   # open, update and merge the release PR
      issues: write          # release PR labels
    outputs:
      release_created: ${{ steps.after.outputs.release_created || steps.before.outputs.release_created }}
      tag_name: ${{ steps.after.outputs.tag_name || steps.before.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Tests gate the release
        run: ruff check . && pytest -q

      - uses: googleapis/release-please-action@v5
        id: before
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Merge the release PR
        id: merge
        if: steps.before.outputs.release_created != 'true' && steps.before.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label "autorelease: pending" --json number --jq '.[0].number')
          test -n "$pr" || { echo "no open release PR found"; exit 1; }
          # GitHub computes mergeability a moment after the PR is created or updated: retry briefly
          for attempt in 1 2 3 4 5 6; do
            gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash --delete-branch && break
            test "$attempt" -lt 6 || exit 1
            sleep 5
          done
          echo "merged=true" >> "$GITHUB_OUTPUT"
          sleep 5    # let the merge settle before release-please looks for it

      - uses: googleapis/release-please-action@v5
        id: after
        if: steps.merge.outputs.merged == 'true'
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Tag matches package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          tag="${{ needs.release.outputs.tag_name }}"
          test "v$version" = "$tag" || { echo "tag $tag != v$version"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/lobkit/
    permissions:
      id-token: write    # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
